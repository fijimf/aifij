# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.org.springframework=INFO

# JWT Configuration
app.jwt.secret=${JWT_SECRET:bXktc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItdGVzdGluZw==}
app.jwt.expiration=${JWT_EXPIRATION:1800000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=ALWAYS
management.endpoint.env.show-values=WHEN_AUTHORIZED

# Initialization configuration file path
deepfij.initialization=classpath:deepfij-init-full.json

# Scheduled refresh configuration
# Cron expression for periodic schedule and statistics refresh
# Default: every hour at minute 0 (0 0 * * * *)
# Format: second minute hour day month weekday
deepfij.refresh.cron=${DEEPFIJ_REFRESH_CRON:0 4 * * * *}
deepfij.refresh.enabled=${DEEPFIJ_REFRESH_ENABLED:true}