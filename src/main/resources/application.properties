# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.org.springframework=INFO

# JWT Configuration
app.jwt.secret=${JWT_SECRET:bXktc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItdGVzdGluZw==}
app.jwt.expiration=${JWT_EXPIRATION:1800000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized 