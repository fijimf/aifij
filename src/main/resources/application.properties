# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL performance tuning
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.prepareThreshold=1

# Flyway
spring.flyway.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.fijimf.deepfij.service=INFO

# JWT Configuration
app.jwt.secret=${JWT_SECRET:bXktc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItdGVzdGluZw==}
app.jwt.expiration=${JWT_EXPIRATION:1800000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=ALWAYS
management.endpoint.env.show-values=WHEN_AUTHORIZED

# Initialization configuration file path
deepfij.initialization=classpath:deepfij-init-full.json

# Scheduled refresh configuration
# Cron expression for periodic schedule and statistics refresh
# Default: every hour at minute 0 (0 0 * * * *)
# Format: second minute hour day month weekday
deepfij.refresh.cron=${DEEPFIJ_REFRESH_CRON:0 4 * * * *}
deepfij.refreshStats.cron=${DEEPFIJ_REFRESH_STATS_CRON:0 5 * * * *}
deepfij.refresh.enabled=${DEEPFIJ_REFRESH_ENABLED:true}